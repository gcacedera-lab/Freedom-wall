<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silent Sanctuary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Caveat:wght@600&family=Newsreader:ital@0;1&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f6f2;color:#1d1a16;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.app{max-width:1200px;margin:12px auto;background:#f7f4ef;border-radius:32px;overflow:hidden;border:1px solid #ece7df}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:28px 32px 12px}
.brand{display:flex;align-items:center;gap:14px;flex:none}
.logo{width:54px;height:54px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#1f1f1f 2px 4px);display:grid;place-items:center;box-shadow:0 4px 10px #0003}
.logo i{width:20px;height:20px;border-radius:50%;background:#f0b93a}
h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.amp{font-family:"Playfair Display",serif;font-style:italic;font-weight:400;color:#a65a2a}
.brand p{margin:4px 0 0;color:#8a8379;font-size:.95rem}
