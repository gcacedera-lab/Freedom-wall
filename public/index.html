<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silent Sanctuary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Caveat:wght@600&family=Newsreader:ital@0;1&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f6f2;color:#1d1a16;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.app{max-width:1200px;margin:12px auto;background:#f7f4ef;border-radius:32px;overflow:hidden;border:1px solid #ece7df}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:28px 32px 12px}
.brand{display:flex;align-items:center;gap:14px;flex:none}
.logo{width:54px;height:54px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#1f1f1f 2px 4px);display:grid;place-items:center;box-shadow:0 4px 10px #0003}
.logo i{width:20px;height:20px;border-radius:50%;background:#f0b93a}
h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.amp{font-family:"Playfair Display",serif;font-style:italic;font-weight:400;color:#a65a2a}
.brand p{margin:4px 0 0;color:#8a8379;font-size:.95rem}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e8e3da;border-radius:999px;padding:0 18px}
.search svg{flex:none;color:#9a938a}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;padding:15px 0;color:#222;min-width:0}
.post{background:#1d1a16;color:#fff;border:0;border-radius:999px;padding:15px 26px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 32px 20px}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e8e3da;border-radius:999px;padding:9px 18px;font:inherit;font-size:.95rem;cursor:pointer;color:#2a261f}
.chip.on{background:#1d1a16;color:#fff;border-color:#1d1a16}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:8px;background:#e8f8ef;border:1px solid #bfe8d0;color:#2f7d55;border-radius:999px;padding:7px 14px;font-size:.9rem}
.live i{width:8px;height:8px;border-radius:50%;background:#3dbb83}
#count{color:#8a8379;font-size:.95rem}
main{border-top:1px solid #ece7df;padding:36px 32px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:34px 28px;align-items:start;background-image:radial-gradient(#ddd6cb 1px,transparent 1px);background-size:26px 26px}
.empty{grid-column:1/-1;text-align:center;color:#8a8379;padding:40px 0}
.note{position:relative;background:var(--bg);color:var(--ink);border:1.5px solid var(--bd);border-radius:28px;padding:26px;transform:rotate(var(--tilt));box-shadow:0 8px 20px #0000000d}
.t-cream{--bg:#fffbe6;--bd:#f3e7a6;--song:#faf1cc;--ink:#2b2418;--tape:#f5e58e}
.t-blush{--bg:#fff0f3;--bd:#f6cdd7;--song:#fbdde4;--ink:#2e2025;--tape:#f7c6d1}
.t-sage{--bg:#f0f8ec;--bd:#cfe5c6;--song:#e0f0d8;--ink:#1f2a1f;--tape:#bfe0b5}
.t-lilac{--bg:#f4f0fd;--bd:#dcd2f4;--song:#e8e0f9;--ink:#262033;--tape:#d3c6f1}
.t-midnight{--bg:#201e27;--bd:#3b3846;--song:#2d2a37;--ink:#f4efe6;--tape:#8c8499}
.t-sunset{--bg:#fff1e2;--bd:#f6d1a6;--song:#fde0bf;--ink:#33241a;--tape:#f4c58a}
.tape{position:absolute;top:-12px;left:50%;width:120px;height:28px;margin-left:-60px;background:var(--tape);opacity:.8;transform:rotate(-2deg)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.who{font-family:Caveat,cursive;font-size:1.7rem;overflow:hidden;text-overflow:ellipsis}
.when{font-size:.85rem;opacity:.65;white-space:nowrap}
.text{font-family:Newsreader,Georgia,serif;font-size:1.3rem;line-height:1.4;margin:22px 0;white-space:pre-wrap;word-wrap:break-word}
.song{display:flex;align-items:center;gap:14px;background:var(--song);border:1px solid var(--bd);border-radius:22px;padding:14px}
.vinyl{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;flex:none;padding:0;display:grid;place-items:center;background:repeating-radial-gradient(circle,#111 0 2px,#1f1f1f 2px 4px);box-shadow:0 4px 10px #0004}
.vinyl i{width:24px;height:24px;border-radius:50%;background:#f0b93a;position:relative}
.vinyl i::after{content:"";position:absolute;left:9px;top:7px;border-left:8px solid #1a1a1a;border-top:5px solid transparent;border-bottom:5px solid transparent}
.vinyl.on{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.info{min-width:0;display:grid;gap:2px}
.info b{font-size:1.05rem;overflow:hidden;text-overflow:ellipsis}
.artist{opacity:.8}
.hint{font-style:normal;font-size:.85rem;opacity:.55}
.player{margin-top:10px}
.player iframe{width:100%;border:0;border-radius:14px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:.85rem;letter-spacing:.08em;opacity:.9}
.tag{opacity:.55}
.heart{display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit;font:inherit;font-size:1rem;cursor:pointer;padding:4px}
.heart svg{fill:none;stroke:currentColor;stroke-width:2}
.heart.on{color:#e0486a}
.heart.on svg{fill:#e0486a}
footer{text-align:center;padding:22px;border-top:1px solid #ece7df;font-family:Newsreader,serif;font-style:italic;color:#8a8379}
dialog{border:0;border-radius:26px;padding:26px;width:calc(100% - 32px);max-width:460px;background:#fff;color:#1d1a16}
dialog::backdrop{background:#0007}
dialog h2{margin:0 0 14px}
form{display:grid;gap:10px}
input,textarea{font:inherit;padding:12px 14px;border:1px solid #e0dad0;border-radius:14px;width:100%;background:#fcfbf9;color:#1d1a16}
textarea{min-height:100px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.themes label{cursor:pointer}
.themes input{display:none}
.themes span{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid #e0dad0;border-radius:999px;font-size:.85rem}
.themes input:checked+span{border-color:#1d1a16;background:#f4f0e8}
.actions{display:flex;gap:10px;justify-content:flex-end}
.ghost{background:none;border:0;font:inherit;cursor:pointer;padding:12px 16px;color:#6b645a}
#msg{font-size:.85rem;color:#c0392b;min-height:1em}
@media(max-width:700px){header,.filters{padding-left:18px;padding-right:18px}main{padding:30px 18px}h1{font-size:1.6rem}.post{width:100%}.spacer{display:none}}
#results{display:grid;gap:6px}
.res{display:flex;align-items:center;gap:12px;text-align:left;background:#fcfbf9;border:1px solid #e0dad0;border-radius:14px;padding:8px;cursor:pointer;font:inherit;color:#1d1a16}
.res img{width:44px;height:44px;border-radius:8px;flex:none;background:#eee}
.res div{display:grid;min-width:0}
.res b,.res span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res span{font-size:.85rem;color:#8a8379}
.none{font-size:.85rem;color:#8a8379;padding:4px 2px}
#picked{background:#f4f0e8;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:.95rem}
.vinyl i.art{background-size:cover;background-position:center;width:36px;height:36px}
.vinyl i.art::after{display:none}
.full{font-size:.8rem;color:inherit;opacity:.7}
.editbtn{background:none;border:1px solid currentColor;border-radius:999px;color:inherit;font:inherit;font-size:.8rem;padding:4px 14px;cursor:pointer;opacity:.75}
#f.editing input[name=name],#f.editing #themes{display:none}
.mini{background:#fff;color:#1d1a16;border:1px solid #e8e3da;border-radius:999px;padding:15px 22px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;width:min(560px,calc(100% - 20px));display:flex;align-items:center;gap:10px;background:#1d1a16;color:#fff;border-radius:999px;padding:8px 10px 8px 8px;box-shadow:0 8px 28px #0006}
#bar[hidden]{display:none}
#barart{width:44px;height:44px;border-radius:50%;background:#333 center/cover;flex:none}
.binfo{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.binfo b,.binfo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.binfo span{font-size:.8rem;opacity:.7}
#bar button{background:none;border:0;color:#fff;font-size:1.25rem;cursor:pointer;padding:6px 8px}
body.hasbar{padding-bottom:84px}
.delbtn{background:none;border:1px solid #c0392b;border-radius:999px;color:#c0392b;font:inherit;font-size:.8rem;padding:4px 14px;cursor:pointer}
footer a{color:inherit;opacity:.5;font-size:.8rem;font-style:normal}
footer{font-size:1.45rem;padding:32px 22px 14px}
.by{font-style:normal;font-size:1.15rem;margin-top:6px}
footer a{display:block;margin:34px 0 0 auto;width:max-content;font-size:.62rem;opacity:.22}
</style></head><body>
<div class="app">
<header>
  <div class="brand"><div class="logo"><i></i></div>
    <div><h1>Silent <span class="amp">Sanctuary</span></h1><p>Leave a note, pin a song, share a feeling.</p></div></div>
  <label class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="Search messages, songs, artists, or names...">
  </label>
  <button class="mini" id="playall">▶ Play music</button>
  <button class="post" id="open">+ Post to Wall</button>
</header>
<div class="filters" id="filters"></div>
<main id="wall"><div class="empty">Loading notes...</div></main>
<footer>"Where words fade, music speaks."<div class="by">made by: calyx</div><a href="#" id="adminlink">Admin</a></footer>
<div id="bar" hidden><div id="barart"></div><div class="binfo"><b id="bartitle"></b><span id="barartist"></span></div><button id="bprev" aria-label="Previous">⏮</button><button id="bplay" aria-label="Play or pause">⏸</button><button id="bnext" aria-label="Next">⏭</button><button id="bclose" aria-label="Close player">✕</button></div>
</div>

<dialog id="dlg">
  <h2>Post to the Wall</h2>
  <form id="f">
    <input name="name" maxlength="30" placeholder="Name (optional, default: Anonymous)">
    <textarea name="text" maxlength="500" placeholder="Write your note..." required></textarea>
    <input id="songq" placeholder="Search a song or artist (optional)" autocomplete="off">
    <div id="results"></div>
    <div id="picked" hidden></div>
    <input type="hidden" name="song"><input type="hidden" name="artist"><input type="hidden" name="preview"><input type="hidden" name="art"><input type="hidden" name="link">
    <div class="themes" id="themes"></div>
    <div id="msg"></div>
    <div class="actions">
      <button type="button" class="ghost" id="cancel">Cancel</button>
      <button class="post" id="send">Post note</button>
    </div>
  </form>
</dialog>

<script>
const THEMES={cream:"Warm Cream",blush:"Soft Blush",sage:"Matcha Sage",lilac:"Dreamy Lilac",midnight:"Midnight Vinyl",sunset:"Golden Sunset"};
const DOT={cream:"#f0d85a",blush:"#f2a2b5",sage:"#8fd1a8",lilac:"#b9a7ee",midnight:"#1d1a16",sunset:"#f0a35e"};
const LEGACY={"#ffd6e0":"blush","#fff3b0":"cream","#c7f0d8":"sage","#cfe8ff":"lilac","#e4d4ff":"lilac","#ffe0c2":"sunset"};
let notes=[],filter="all",query="",liked=new Set();
try{liked=new Set(JSON.parse(localStorage.getItem("ev_liked")||"[]"))}catch(e){}
const $=id=>document.getElementById(id);
const saveLiked=()=>{try{localStorage.setItem("ev_liked",JSON.stringify([...liked]))}catch(e){}};
let adminPw="";
try{adminPw=localStorage.getItem("ev_admin")||""}catch(e){}
let mine={},editing=null;
try{mine=JSON.parse(localStorage.getItem("ev_mine")||"{}")||{}}catch(e){}
const saveMine=()=>{try{localStorage.setItem("ev_mine",JSON.stringify(mine))}catch(e){}};
const canEdit=n=>!!mine[n.id]&&Date.now()/1000-n.time<1800;
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const themeOf=n=>THEMES[n.theme]?n.theme:(LEGACY[n.color]||"cream");
function ago(t){const s=Math.floor(Date.now()/1000-t);
  if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago"}

function embedFor(link){
  try{
    const u=new URL(link),h=u.hostname.replace(/^www\.|^m\./,"");let id=null;
    if(h==="youtu.be")id=u.pathname.slice(1);
    else if(h.endsWith("youtube.com"))id=u.searchParams.get("v")||(u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]+)/)||[])[1];
    if(id&&/^[\w-]{6,}$/.test(id))return{src:"https://www.youtube-nocookie.com/embed/"+id+"?autoplay=1",h:200};
    if(h==="open.spotify.com"){const m=u.pathname.match(/\/(track|album|playlist|episode)\/(\w+)/);
      if(m)return{src:"https://open.spotify.com/embed/"+m[1]+"/"+m[2],h:152}}
  }catch(e){}
  return null;
}
const au=new Audio();au.preload="none";
let queue=[],qi=-1,playingId=null,lastList=[];
function sync(){
  const on=!au.paused&&playingId!=null;
  $("bplay").textContent=on?"\u23F8":"\u25B6";
  $("playall").textContent=on?"\u23F8 Pause music":"\u25B6 Play music";
  document.querySelectorAll(".vinyl[data-id]").forEach(v=>v.classList.toggle("on",on&&+v.dataset.id===playingId));
}
function hideBar(){$("bar").hidden=true;document.body.classList.remove("hasbar")}
function stopAll(except){
  au.pause();playingId=null;hideBar();sync();
  document.querySelectorAll(".vinyl.on").forEach(b=>{
    if(b!==except){b.classList.remove("on");b.closest("article").querySelector(".player").replaceChildren()}
  });
}
function showBar(n){
  const a=$("barart");a.style.backgroundImage=n.art?"url("+JSON.stringify(n.art)+")":"none";
  $("bartitle").textContent=n.song||"Untitled song";
  $("barartist").textContent=n.artist||"";
  $("bar").hidden=false;document.body.classList.add("hasbar");
}
function playAt(i){
  if(!queue.length)return;
  qi=(i+queue.length)%queue.length;
  const n=queue[qi];
  document.querySelectorAll(".player").forEach(p=>p.replaceChildren());
  document.querySelectorAll(".vinyl.on:not([data-id])").forEach(v=>v.classList.remove("on"));
  playingId=n.id;au.src=n.preview;
  const pr=au.play();if(pr&&pr.catch)pr.catch(()=>{});
  showBar(n);sync();
}
function startQueue(startId){
  queue=lastList.filter(n=>n.preview);
  if(!queue.length){alert("No songs with audio on the wall yet.");return}
  let i=queue.findIndex(n=>n.id===startId);if(i<0)i=0;
  playAt(i);
}
au.onplay=au.onpause=sync;
au.onended=()=>{if(queue.length>1)playAt(qi+1);else{playingId=null;sync()}};
au.onerror=()=>{if(queue.length>1)playAt(qi+1)};
$("bplay").onclick=()=>{if(au.paused){const p=au.play();if(p&&p.catch)p.catch(()=>{})}else au.pause()};
$("bnext").onclick=()=>playAt(qi+1);
$("bprev").onclick=()=>playAt(qi-1);
$("bclose").onclick=()=>stopAll();
$("playall").onclick=()=>{
  if(!au.paused&&playingId!=null){au.pause();return}
  if(playingId!=null&&au.src){const p=au.play();if(p&&p.catch)p.catch(()=>{});return}
  startQueue();
};
function toggle(v,n,player){
  if(n.preview){
    if(playingId===n.id&&!au.paused){au.pause();return}
    startQueue(n.id);return;
  }
  if(v.classList.contains("on")){stopAll();return}
  stopAll(v);
  const e=n.link&&embedFor(n.link);
  if(e){v.classList.add("on");const fr=document.createElement("iframe");fr.src=e.src;fr.height=e.h;fr.allow="autoplay; encrypted-media";player.replaceChildren(fr);return}
  if(n.link){window.open(n.link,"_blank","noopener");return}
  window.open("https://www.youtube.com/results?search_query="+encodeURIComponent((n.song||"")+" "+(n.artist||"")),"_blank","noopener");
}

const HEART='<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

function render(){
  const q=query.toLowerCase();
  const list=notes.filter(n=>(filter==="all"||themeOf(n)===filter)&&
    (!q||[n.text,n.song,n.artist,n.name].join(" ").toLowerCase().includes(q)));
  lastList=list;
  $("count").textContent=list.length+(list.length===1?" note":" notes");
  const wall=$("wall");wall.replaceChildren();
  if(!list.length){wall.append(el("div","empty",notes.length?"No notes match your search.":"No notes yet. Be the first to post!"));return}
  for(const n of list){
    const t=themeOf(n);
    const card=el("article","note t-"+t);
    card.style.setProperty("--tilt",(n.rot||0)+"deg");
    card.append(el("span","tape"));
    const top=el("div","top");top.append(el("span","who",n.name),el("span","when",ago(n.time)));
    card.append(top,el("p","text","\u201C"+n.text+"\u201D"));
    if(n.song||n.link){
      const s=el("div","song"),v=el("button","vinyl");
      v.setAttribute("aria-label","Play song");if(n.preview){v.dataset.id=n.id;if(playingId===n.id&&!au.paused)v.classList.add("on")}const vi=el("i");if(n.art){vi.className="art";vi.style.backgroundImage="url("+JSON.stringify(n.art)+")"}v.append(vi);
      const info=el("div","info");
      info.append(el("b",null,n.song||"Untitled song"));
      if(n.artist)info.append(el("span","artist",n.artist));
      info.append(el("em","hint",(n.preview||n.link)?"Tap vinyl to play":"No audio attached"));
      {const a=el("a","full","Full song \u2197");a.href=n.link||("https://www.youtube.com/results?search_query="+encodeURIComponent((n.song||"")+" "+(n.artist||"")));a.target="_blank";a.rel="noopener noreferrer";info.append(a)}
      s.append(v,info);
      const player=el("div","player");
      v.onclick=()=>toggle(v,n,player);
      card.append(s,player);
    }
    const foot=el("div","foot");
    foot.append(el("span","tag","#"+t.toUpperCase()));
    if(adminPw){const db=el("button","delbtn","Delete");db.type="button";db.onclick=()=>delNote(n);foot.append(db)}
    if(canEdit(n)){const eb=el("button","editbtn","Edit");eb.type="button";eb.onclick=()=>openEdit(n);foot.append(eb)}
    const hb=el("button","heart"+(liked.has(n.id)?" on":""));
    hb.innerHTML=HEART;
    const c=el("span",null,n.likes);hb.append(c);
    hb.onclick=async()=>{
      const was=liked.has(n.id);
      if(was)liked.delete(n.id);else liked.add(n.id);
      saveLiked();
      n.likes=Math.max(0,n.likes+(was?-1:1));
      c.textContent=n.likes;hb.classList.toggle("on",!was);
      try{await fetch("/api/like",{method:"POST",body:JSON.stringify({id:n.id,unlike:was})})}catch(e){}
    };
    foot.append(hb);card.append(foot);wall.append(card);
  }
}

function buildFilters(){
  const box=$("filters");
  const mk=(key,label,dot)=>{
    const b=el("button","chip"+(key===filter?" on":""));
    if(dot){const d=el("span","dot");d.style.borderColor=dot;d.style.background=key==="midnight"?dot:"transparent";b.append(d)}
    b.append(document.createTextNode(label));
    b.onclick=()=>{filter=key;box.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");render()};
    box.append(b);
  };
  mk("all","All Notes",null);
  for(const k in THEMES)mk(k,THEMES[k],DOT[k]);
  box.append(el("span","spacer"));
  const live=el("span","live");live.append(el("i"),document.createTextNode("Live Wall"));
  const cnt=el("span",null,"");cnt.id="count";box.append(live,cnt);
}
function buildThemePicker(){
  const box=$("themes");let first=true;
  for(const k in THEMES){
    const l=document.createElement("label"),i=document.createElement("input");
    i.type="radio";i.name="theme";i.value=k;if(first){i.defaultChecked=true;i.checked=true;first=false}
    const s=el("span",null,THEMES[k]);
    const d=el("span","dot");d.style.borderColor=DOT[k];d.style.background=DOT[k];d.style.width=d.style.height="12px";d.style.padding="0";d.style.border="0";
    s.prepend(d);l.append(i,s);box.append(l);
  }
}

async function load(){
  try{notes=await (await fetch("/api/notes")).json()}catch(e){notes=[]}
  render();
}

$("q").oninput=e=>{query=e.target.value;render()};
$("open").onclick=()=>$("dlg").showModal();
$("cancel").onclick=()=>$("dlg").close();
$("f").onsubmit=async e=>{
  e.preventDefault();
  const b=$("send");b.disabled=true;$("msg").textContent=editing?"Saving...":"Posting...";
  try{
    const body=Object.fromEntries(new FormData($("f")));
    let url="/api/notes";
    if(editing){url="/api/edit";body.id=editing.id;body.token=(mine[editing.id]||{}).token}
    const r=await fetch(url,{method:"POST",body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){$("msg").textContent=j.error||"Something went wrong.";if(editing&&r.status===403)await load()}
    else{
      if(!editing&&j.id&&j.token){mine[j.id]={token:j.token};saveMine()}
      const was=editing;
      $("dlg").close();
      if(!was){$("f").reset();clearPick()}
      $("msg").textContent="";
      await load();
    }
  }catch(err){$("msg").textContent="Network error. Try again."}
  b.disabled=false;
};

const form=$("f");
let st=null;
function clearPick(){
  ["song","artist","preview","art","link"].forEach(k=>form.elements[k].value="");
  $("picked").hidden=true;$("songq").hidden=false;
}
function pick(t){
  form.elements.song.value=t.trackName||"";
  form.elements.artist.value=t.artistName||"";
  form.elements.preview.value=t.previewUrl||"";
  form.elements.art.value=(t.artworkUrl100||"").replace("100x100","200x200");
  form.elements.link.value="";
  const p=$("picked");p.hidden=false;p.textContent="\u{1F3B5} "+t.trackName+" \u2013 "+t.artistName+"   \u2715";
  $("results").replaceChildren();$("songq").value="";$("songq").hidden=true;
}
$("picked").onclick=clearPick;
$("songq").oninput=e=>{
  clearTimeout(st);
  const q=e.target.value.trim(),box=$("results");
  if(q.length<2){box.replaceChildren();return}
  st=setTimeout(async()=>{
    try{
      const r=await fetch("https://itunes.apple.com/search?media=music&entity=song&limit=6&term="+encodeURIComponent(q));
      const j=await r.json();
      box.replaceChildren();
      for(const t of j.results||[]){
        const b=el("button","res");b.type="button";
        const img=document.createElement("img");img.src=t.artworkUrl60||"";img.alt="";
        const d=el("div",null);d.append(el("b",null,t.trackName),el("span",null,t.artistName));
        b.append(img,d);b.onclick=()=>pick(t);box.append(b);
      }
      if(!box.children.length)box.append(el("div","none","No songs found."));
    }catch(err){box.replaceChildren(el("div","none","Could not search. Check your connection."))}
  },400);
};

function openEdit(n){
  if(!canEdit(n)){load();return}
  editing=n;
  const f=$("f");f.classList.add("editing");
  clearPick();
  f.elements.text.value=n.text;
  if(n.song||n.link){
    f.elements.song.value=n.song||"";f.elements.artist.value=n.artist||"";
    f.elements.preview.value=n.preview||"";f.elements.art.value=n.art||"";f.elements.link.value=n.link||"";
    const p=$("picked");p.hidden=false;
    p.textContent="\u{1F3B5} "+(n.song||"Song")+(n.artist?" \u2013 "+n.artist:"")+"   \u2715";
    $("songq").hidden=true;
  }
  $("dlg").querySelector("h2").textContent="Edit your note";
  $("send").textContent="Save changes";
  $("msg").textContent="You can edit for 30 minutes after posting.";
  $("dlg").showModal();
}
$("dlg").addEventListener("close",()=>{
  if(!editing)return;
  editing=null;
  const f=$("f");f.classList.remove("editing");f.reset();clearPick();
  $("dlg").querySelector("h2").textContent="Post to the Wall";
  $("send").textContent="Post note";$("msg").textContent="";
});

async function delNote(n){
  if(!confirm("Delete this note for everyone?"))return;
  try{
    const r=await fetch("/api/delete",{method:"POST",body:JSON.stringify({id:n.id,password:adminPw})});
    if(!r.ok){const j=await r.json().catch(()=>({}));alert(j.error||"Could not delete.");if(r.status===401)setAdmin("");return}
    await load();
  }catch(e){alert("Network error. Try again.")}
}
function setAdmin(pw){
  adminPw=pw;
  try{if(pw)localStorage.setItem("ev_admin",pw);else localStorage.removeItem("ev_admin")}catch(e){}
  $("adminlink").textContent=pw?"Admin: log out":"Admin";
  render();
}
$("adminlink").onclick=async e=>{
  e.preventDefault();
  if(adminPw){setAdmin("");return}
  const pw=prompt("Admin password");
  if(!pw)return;
  try{
    const r=await fetch("/api/admin",{method:"POST",body:JSON.stringify({password:pw})});
    if(r.ok)setAdmin(pw);else{const j=await r.json().catch(()=>({}));alert(j.error||"Wrong password.")}
  }catch(err){alert("Network error. Try again.")}
};
if(adminPw)$("adminlink").textContent="Admin: log out";

buildFilters();buildThemePicker();load();
</script></body></html>
